name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./LeviDex
        run: npm install

      - name: Prebuild Android native project
        working-directory: ./LeviDex
        run: npx expo prebuild --clean --platform android

      - name: Build APK with Gradle
        working-directory: ./LeviDex/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviDex-App-APK
          path: LeviDex/android/app/build/outputs/apk/debug/app-debug.apk
