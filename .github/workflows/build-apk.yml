name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./ElectroGuide
        run: npm install

      - name: Expo Prebuild (Generate Native Android folder)
        working-directory: ./ElectroGuide
        run: npx expo prebuild --platform android --clean

      - name: Build APK (Gradle assembleDebug)
        working-directory: ./ElectroGuide/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LEVIDEX-App-APK
          path: ./ElectroGuide/android/app/build/outputs/apk/release/app-debug.apk
