name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./LeviDex
        run: npm install

      - name: Prebuild Android
        working-directory: ./LeviDex
        run: npx expo prebuild -p android --clean

      - name: Prevent GitHub Actions OOM Crash
        working-directory: ./LeviDex/android
        run: |
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties

      - name: Build APK with Gradle
        working-directory: ./LeviDex/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviDex-App-APK
          path: LeviDex/android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: LeviDex/android/app/build/outputs/apk/release/app-release.apk
